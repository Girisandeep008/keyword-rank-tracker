name: Debug SERP (temporary)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump full Serper results
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          KEYWORDS = ["Crystal Crop Protection ipo", "Crystal Crop Protection",
                      "Watrana Rentals ipo", "Watrana Rentals",
                      "MakeMyTrip ipo", "boAt ipo", "PhonePe ipo"]
          def search(q, page):
              req = urllib.request.Request("https://google.serper.dev/search", method="POST",
                  data=json.dumps({"q": q, "gl": "in", "hl": "en", "num": 10, "page": page}).encode(),
                  headers={"X-API-KEY": os.environ["SERPER_API_KEY"], "Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          for q in KEYWORDS:
              print(f"\n===== {q} =====")
              n = 0
              for page in (1, 2, 3):
                  d = search(q, page)
                  print(f"--- page {page}: sections = {sorted(k for k in d if k not in ('searchParameters', 'credits'))}")
                  for item in d.get("organic", []):
                      n += 1
                      mark = "  <== ZERODHA" if "zerodha" in item.get("link", "") else ""
                      print(f"  {n:>2}. (serper pos {item.get('position')}) {item.get('link')}{mark}")
                  for key, val in d.items():
                      if key in ("organic", "searchParameters", "credits"):
                          continue
                      blob = json.dumps(val)
                      if "zerodha" in blob.lower():
                          print(f"  ZERODHA FOUND IN SECTION '{key}': {blob[:600]}")
          EOF
