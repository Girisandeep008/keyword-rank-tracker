name: Weekly keyword rankings

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check rankings
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python rank_tracker.py

      - name: Commit results
        run: |
          git config user.name "rank-tracker-bot"
          git config user.email "rank-tracker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Rankings for $(date -u +%F)"
          git push
